name: Docs

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    name: mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      # Fails the build when SUMMARY.md and the files on disk have drifted apart, which is
      # the one thing about the book that nothing else notices.
      - run: mdbook build docs

      # Canonical links and the sitemap need the published URLs, which only
      # exist once the book is built.
      - run: ./docs/seo.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    name: GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
