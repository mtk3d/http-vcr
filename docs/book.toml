[book]
title = "http-vcr for PHP"
description = "Record and replay HTTP requests in PHP tests. http-vcr decorates any PSR-18 client, so your suite runs fast and deterministic with no network access and no API keys."
authors = ["Mateusz Cholewka"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
site-url = "/http-vcr/"
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/mtk3d/http-vcr"
edit-url-template = "https://github.com/mtk3d/http-vcr/edit/master/docs/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
